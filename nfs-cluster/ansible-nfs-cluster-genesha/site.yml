---
# ==========================================
# PLAY 1: Common setup for ALL nodes
# ==========================================
- name: Common setup (hosts file, time sync, prerequisites)
  hosts: all
  become: true
  roles:
    - common

# ==========================================
# PLAY 2: Deploy Ceph on storage nodes
# ==========================================
- name: Deploy HA Ceph Storage Cluster
  hosts: ceph_nodes
  become: true
  roles:
    - ceph

# ==========================================
# PLAY 3: Deploy NFS-Ganesha on storage nodes
# ==========================================
- name: Deploy NFS-Ganesha Gateways
  hosts: ceph_nodes
  become: true
  roles:
    - nfs_ganesha

# ==========================================
# PLAY 4: Configure HA with Pacemaker/Corosync
# ==========================================
- name: Configure Pacemaker and Corosync for HA
  hosts: ceph_nodes
  become: true
  roles:
    - pacemaker_corosync

# ==========================================
# PLAY 5: Configure NFS clients
# ==========================================
- name: Configure NFS Clients on Kubernetes nodes
  hosts: nfs_clients
  become: true
  roles:
    - nfs_client

# ==========================================
# PLAY 6: Automated Post-Installation Health Verification
# ==========================================
- name: Verify Full System Health & Installation Status
  hosts: all
  become: true
  vars:
    verify_mode: "install"
  roles:
    - verify
