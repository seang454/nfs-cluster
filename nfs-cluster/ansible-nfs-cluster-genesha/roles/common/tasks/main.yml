---
# tasks file for common role
# Runs on ALL nodes before any other role.
# Sets up hostname resolution, time sync, and prerequisites.

# ==========================================
# STEP 1: Configure /etc/hosts & hostname
# ==========================================
- name: Deploy /etc/hosts file for hostname resolution
  template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'

- name: Set system hostname to match inventory_hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# ==========================================
# STEP 2: Install chrony for time synchronization
# ==========================================
- name: Install chrony for time synchronization
  package:
    name: chrony
    state: present

- name: Enable and start chrony
  systemd:
    name: chronyd
    state: started
    enabled: yes

# ==========================================
# STEP 3: Keep UFW Firewall Disabled (Default)
# ==========================================
- name: Disable ufw firewall on all nodes
  ufw:
    state: disabled
  when: disable_firewall | default(true)
  failed_when: false

- name: Enable ufw firewall and allow production ports
  block:
    - name: Ensure ufw is installed and enabled
      ufw:
        state: enabled
        policy: allow
      failed_when: false

    - name: Allow SSH port 22
      ufw:
        rule: allow
        port: '22'
        proto: tcp
      failed_when: false

    - name: Allow production cluster ports (Ceph, NFS, Pacemaker, Corosync)
      ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: '2049', proto: 'tcp' }      # NFS Service
        - { port: '111', proto: 'tcp' }       # RPCbind
        - { port: '20048', proto: 'tcp' }     # Mountd
        - { port: '6789', proto: 'tcp' }      # Ceph Monitor
        - { port: '3300', proto: 'tcp' }      # Ceph Monitor v2
        - { port: '6800:7300', proto: 'tcp' } # Ceph OSD & MGR Daemons
        - { port: '5404:5405', proto: 'udp' } # Corosync Cluster Communication
        - { port: '2224', proto: 'tcp' }      # PCS Daemon API
        - { port: '6443', proto: 'tcp' }      # Kubernetes API (Master nodes)
      failed_when: false
  when: not (disable_firewall | default(true))

# ==========================================
# STEP 4: Install basic prerequisites
# ==========================================
- name: Install basic prerequisites
  package:
    name:
      - curl
      - wget
      - gnupg
      - apt-transport-https
      - ca-certificates
      - software-properties-common
      - net-tools
    state: present
