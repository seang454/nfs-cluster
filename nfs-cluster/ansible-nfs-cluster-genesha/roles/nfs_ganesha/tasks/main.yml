---
# tasks file for nfs_ganesha

# ==========================================
# STEP 1: Install NFS-Ganesha packages
# ==========================================
- name: Install nfs-ganesha and nfs-ganesha-ceph
  package:
    name:
      - nfs-ganesha
      - nfs-ganesha-ceph
    state: present

# ==========================================
# STEP 2: Create dedicated Ceph user for Ganesha (FIRST NODE ONLY)
# ==========================================
- name: Create or get dedicated Ceph user keyring for Ganesha
  command: ceph auth get-or-create client.ganesha -o /etc/ceph/ceph.client.ganesha.keyring
  run_once: true
  delegate_to: "{{ groups['ceph_nodes'][0] }}"

- name: Ensure Ceph auth caps for client.ganesha
  command: >
    ceph auth caps client.ganesha
    mon 'allow r'
    osd 'allow rw pool={{ ceph_pool_data }}, allow rw pool={{ ceph_pool_metadata }}'
    mds 'allow *'
  run_once: true
  delegate_to: "{{ groups['ceph_nodes'][0] }}"

# ==========================================
# STEP 3: Distribute Ganesha keyring to all nodes
# ==========================================
- name: Read Ganesha keyring from first node
  slurp:
    src: /etc/ceph/ceph.client.ganesha.keyring
  register: ganesha_keyring_content
  run_once: true
  delegate_to: "{{ groups['ceph_nodes'][0] }}"

- name: Copy Ganesha keyring to all nodes
  copy:
    content: "{{ ganesha_keyring_content['content'] | b64decode }}"
    dest: /etc/ceph/ceph.client.ganesha.keyring
    owner: root
    group: root
    mode: '0600'

# ==========================================
# STEP 4: Get Ceph secret key for Ganesha user
# ==========================================
- name: Get Ceph secret key for Ganesha
  command: ceph auth get-key client.ganesha
  register: ganesha_key_result
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_nodes'][0] }}"

- name: Set Ganesha key fact for all nodes
  set_fact:
    ceph_ganesha_key: "{{ hostvars[groups['ceph_nodes'][0]]['ganesha_key_result']['stdout'] }}"

# ==========================================
# STEP 5: Deploy NFS-Ganesha configuration
# ==========================================
- name: Ensure /etc/ganesha directory exists
  ansible.builtin.file:
    path: /etc/ganesha
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy NFS-Ganesha configuration
  template:
    src: ganesha.conf.j2
    dest: /etc/ganesha/ganesha.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart nfs-ganesha

- name: Ensure /var/run/ganesha directory exists
  ansible.builtin.file:
    path: /var/run/ganesha
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy systemd tmpfiles for persistent /var/run/ganesha directory
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/nfs-ganesha.conf
    content: "d /var/run/ganesha 0755 root root -\n"
    mode: '0644'

- name: Create systemd override directory for NFS-Ganesha
  ansible.builtin.file:
    path: /etc/systemd/system/nfs-ganesha.service.d
    state: directory
    mode: '0755'

- name: Deploy systemd override for NFS-Ganesha (prevent DBus hangs & ensure pid directory)
  ansible.builtin.copy:
    dest: /etc/systemd/system/nfs-ganesha.service.d/override.conf
    content: |
      [Service]
      ExecStartPre=/bin/mkdir -p /var/run/ganesha
      ExecStartPre=-/bin/rm -rf /var/lib/ganesha/v4_recov /var/lib/ganesha/v4_old /var/lib/nfs/ganesha/*
      ExecStop=
      ExecStop=/bin/pkill -9 ganesha.nfsd
      TimeoutStopSec=5
    mode: '0644'

# ==========================================
# STEP 6: Ensure NFS-Ganesha systemd service is disabled locally
# (Pacemaker HA will manage starting/stopping the daemon)
# ==========================================
- name: Disable local systemd management of NFS-Ganesha
  ansible.builtin.systemd:
    name: nfs-ganesha
    state: stopped
    enabled: no
    daemon_reload: true
  failed_when: false
